<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finans Kanalı Kontrol</title>
<style>
:root{--bg:#060a14;--glass:rgba(16,24,44,.62);--line:rgba(120,150,210,.16);--tx:#e9eefb;--mut:#8493b3;--gold:#f6c453;--cy:#38d6ff;--ok:#34e39a;--warn:#ffb84a;--bad:#ff5d73;--vi:#8b7bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
/* arka plan: aurora + ızgara + parçacık */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:55vw;height:55vw;border-radius:50%;filter:blur(110px);opacity:.34;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#1747ff;left:-12vw;top:-18vw}
.aurora i:nth-child(2){background:#b8860b;right:-14vw;top:8vh;animation-duration:32s;opacity:.22}
.aurora i:nth-child(3){background:#00b3a4;left:30vw;bottom:-30vw;animation-duration:38s;opacity:.2}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.15)}}
.grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 50% 30%,#000 0,transparent 75%);opacity:.5;pointer-events:none}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
header{display:flex;align-items:center;gap:16px;padding:14px 26px;position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);background:linear-gradient(180deg,rgba(6,10,20,.85),rgba(6,10,20,.4));border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#d98a1f);display:grid;place-items:center;font-weight:900;color:#1a1204;box-shadow:0 0 22px rgba(246,196,83,.45);letter-spacing:-1px}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500;letter-spacing:1.6px;text-transform:uppercase}
.sp{flex:1}
.orb{display:flex;align-items:center;gap:10px;padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-weight:600;font-size:13px}
.orb b{position:relative;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}
.orb b::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ring 1.8s infinite}
.orb.run b{background:var(--cy);box-shadow:0 0 14px var(--cy);color:var(--cy)}.orb.run b::after{opacity:1}
.orb.warn b{background:var(--warn);box-shadow:0 0 12px var(--warn)}.orb.bad b{background:var(--bad);box-shadow:0 0 12px var(--bad)}
@keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.9);opacity:0}}
#clock{font:600 22px/1 "Cascadia Mono",Consolas,monospace;color:var(--gold);text-shadow:0 0 14px rgba(246,196,83,.5)}
.date{color:var(--mut);font-size:11px;text-align:right}
/* haber bandı */
.ticker{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);background:rgba(10,16,32,.5);font-size:12.5px;color:#b8c5e2}
.ticker div{display:inline-block;padding:7px 0;animation:tick 80s linear infinite}
.ticker span{margin:0 26px}.ticker em{font-style:normal;color:var(--gold);margin-right:8px;font-weight:700}
@keyframes tick{to{transform:translateX(-50%)}}
main{padding:22px 26px 40px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px;max-width:1700px;margin:0 auto}
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);position:relative;overflow:hidden;transition:border-color .3s,transform .3s}
.card:hover{border-color:rgba(120,170,255,.38)}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--c,var(--cy)),transparent);opacity:.7}
.card h2{margin:0 0 12px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:8px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1200px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
/* üst istatistikler */
.stat{display:flex;gap:14px;align-items:center}
.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.stat .n{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.5px}.stat .l{color:var(--mut);font-size:12px;margin-top:4px}
.stat .n.g{color:var(--gold)}.stat .n.c{color:var(--cy)}.stat .n.o{color:var(--ok)}.stat .n.b{color:var(--bad)}
/* boru hattı */
.pipe{display:flex;align-items:flex-start;overflow-x:auto;padding:8px 2px 14px}
.node{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;width:86px;position:relative;font-size:11px;color:var(--mut);text-align:center}
.node .d{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#101a33;border:2px solid var(--ok);color:var(--ok);box-shadow:0 0 14px rgba(52,227,154,.35);position:relative;z-index:1}
.node:not(:last-child)::after{content:"";position:absolute;top:15px;left:calc(50% + 15px);width:calc(100% - 30px);height:2px;background:linear-gradient(90deg,var(--ok),rgba(52,227,154,.25))}
.node.now .d{border-color:var(--cy);color:var(--cy);box-shadow:0 0 18px var(--cy);animation:pl 1.4s infinite}
@keyframes pl{50%{transform:scale(1.18)}}
.node .t{margin-top:7px;color:var(--tx);font-weight:600}
/* döngü halkaları */
.rings{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ringc{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.ring{--p:0;--c:var(--cy);width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#0d1530}
.ring span{position:relative;font-size:11px;font-weight:700}
.ringc.act .ring{animation:glow 1.5s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 8px var(--cy))}}
.ringc b{display:block;font-size:13px}.ringc small{color:var(--mut);font-size:11px}
/* videolar */
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.v{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:rgba(8,13,28,.7);transition:.25s;display:block;color:inherit;text-decoration:none}
.v:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 22px rgba(246,196,83,.18)}
.v .im{position:relative;aspect-ratio:16/9;background:#0a1226 center/cover}
.v.s .im{aspect-ratio:16/9;background-size:auto 100%;background-repeat:no-repeat}
.v .bd{position:absolute;left:8px;top:8px}
.v .vw{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700}
.v .tt{padding:9px 11px 11px;font-size:12.5px;line-height:1.35;height:56px;overflow:hidden}
.pill{white-space:nowrap;display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--mut);background:rgba(8,13,28,.7)}
.pill.ok{color:var(--ok);border-color:rgba(52,227,154,.4)}.pill.warn{color:var(--warn);border-color:rgba(255,184,74,.4)}.pill.bad{color:var(--bad);border-color:rgba(255,93,115,.45)}.pill.acc{color:var(--cy);border-color:rgba(56,214,255,.4)}.pill.gold{color:var(--gold);border-color:rgba(246,196,83,.4)}
/* görevler */
.tk{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}.tk:last-child{border:0}
.tk .nm{flex:1;font-weight:600}.tk .rel{font:600 12px "Cascadia Mono",Consolas,monospace;color:var(--cy)}.tk small{color:var(--mut);display:block;font-weight:400;font-size:11px}
/* sekmeler */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--mut);cursor:pointer;font-size:12.5px;font-weight:600;transition:.2s}
.tab.on{color:#1a1204;background:linear-gradient(135deg,var(--gold),#e39a2b);border-color:transparent}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.6 "Cascadia Mono",Consolas,monospace;color:#bccaea;max-height:380px;overflow:auto}
.btn{background:rgba(255,255,255,.05);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.2s}
.btn:hover{border-color:var(--cy);box-shadow:0 0 16px rgba(56,214,255,.25);transform:translateY(-1px)}.btn.bad:hover{border-color:var(--bad);box-shadow:0 0 16px rgba(255,93,115,.25)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}.mut{color:var(--mut)}
.al{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:flex-start}.al:last-child{border:0}.al small{color:var(--mut);white-space:nowrap}
.scroll{max-height:330px;overflow:auto}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--cy),var(--vi));transition:width .8s}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#243459;border-radius:9px}
a{color:var(--cy);text-decoration:none}
#toast{position:fixed;right:22px;bottom:22px;background:rgba(14,22,44,.95);border:1px solid var(--cy);padding:11px 18px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.3s;z-index:50;box-shadow:0 0 24px rgba(56,214,255,.3)}
#toast.on{opacity:1;transform:none}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div><div class="grid"></div><canvas id="fx"></canvas>
<div class="wrap">
<header>
  <div class="logo">SP</div>
  <h1>Finans Kanalı<small>Komuta Merkezi</small></h1>
  <div class="sp"></div>
  <div id="durum" class="orb"><b></b><span>yükleniyor…</span></div>
  <div><div id="clock">--:--:--</div><div class="date" id="date"></div></div>
</header>
<div class="ticker"><div id="ticker"></div></div>
<main>
  <section class="card c3" style="--c:var(--gold)"><div class="stat"><div class="ico">🎬</div><div><div class="n g" id="s_vid">0</div><div class="l">yayındaki video (son 3 iş)</div></div></div></section>
  <section class="card c3" style="--c:var(--cy)"><div class="stat"><div class="ico">👁</div><div><div class="n c" id="s_view">0</div><div class="l">toplam izlenme (son 3 iş)</div></div></div></section>
  <section class="card c3" style="--c:var(--ok)"><div class="stat"><div class="ico">🤖</div><div><div class="n o" id="s_loop">—</div><div class="l" id="s_loop_l">ajan döngüsü</div></div></div></section>
  <section class="card c3" style="--c:var(--bad)"><div class="stat"><div class="ico">⚠️</div><div><div class="n" id="s_al">0</div><div class="l">açık uyarı (son 12)</div></div></div></section>

  <section class="card c12" style="--c:var(--ok)"><h2>Günlük üretim hattı <span class="pill" id="p_is"></span><span class="sp"></span><span class="mut" id="p_lock" style="text-transform:none;letter-spacing:0"></span></h2><div class="pipe" id="pipe"></div></section>

  <section class="card c7" style="--c:var(--gold)"><h2>Videolar · YouTube'dan canlı</h2><div class="vids" id="videolar"></div></section>
  <section class="card c5" style="--c:var(--vi)"><h2>Ajan döngüsü
      <span class="sp"></span><button class="btn" onclick="loop('baslat')">▶ Başlat</button><button class="btn bad" onclick="loop('durdur')">■ Durdur</button></h2>
    <div class="rings" id="rings"></div>
    <div style="margin-top:14px" id="sistem"></div></section>

  <section class="card c6" style="--c:var(--cy)"><h2>Zamanlanmış görevler</h2><div class="scroll" id="gorevler"></div></section>
  <section class="card c6" style="--c:var(--warn)"><h2>Ajanları şimdi çalıştır</h2>
    <div class="btns" style="margin-bottom:14px">
      <button class="btn" onclick="run('trend')">📈 Trend avcısı</button><button class="btn" onclick="run('haber')">📰 Haber avcısı</button>
      <button class="btn" onclick="run('editor')">✂️ Gece editörü</button><button class="btn" onclick="run('referans')">🎯 Referans kanal</button><button class="btn" onclick="run('sistem')">🩺 Sistem bekçisi</button>
    </div>
    <h2 style="margin-top:4px">Uyarılar</h2><div class="scroll" id="uyarilar" style="max-height:210px"></div></section>

  <section class="card c12" style="--c:var(--vi)">
    <div class="tabs" id="tabs"></div><pre id="panel"></pre></section>
</main>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}
async function post(u){const r=await fetch(u,{method:'POST'});const j=await r.json();toast(j.mesaj||'tamam');setTimeout(load,1500)}
const run=a=>post('/api/run?ajan='+a), loop=i=>post('/api/loop?islem='+i);
const dk=v=>v?String(v).replace('T',' ').slice(5,16):'—';
// saat
setInterval(()=>{const d=new Date();$('clock').textContent=d.toLocaleTimeString('tr-TR');$('date').textContent=d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})},1000);
// sayaç animasyonu
const cur={};
function count(id,to){const el=$(id);const from=cur[id]??0;cur[id]=to;const t0=performance.now();(function f(t){const k=Math.min((t-t0)/900,1);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3))).toLocaleString('tr-TR');if(k<1)requestAnimationFrame(f)})(t0)}
function rel(s){if(!s)return '—';const m=(new Date(s.replace(' ','T'))-new Date())/60000;if(isNaN(m))return s;const a=Math.abs(m);const t=a<60?Math.round(a)+' dk':a<1440?(a/60).toFixed(1)+' sa':Math.round(a/1440)+' gün';return m>=0?t+' sonra':t+' önce'}
let TAB='trend',DATA=null;
const TABS=[['trend','📈 Trend özeti'],['editor','✂️ Editör notu'],['haber','📰 Gündem'],['glog','🧾 Günlük koşu günlüğü'],['alog','🛰 Ajan günlüğü']];
function drawTabs(){$('tabs').innerHTML=TABS.map(([k,n])=>`<div class="tab ${k===TAB?'on':''}" onclick="TAB='${k}';drawTabs();drawPanel()">${n}</div>`).join('')}
function drawPanel(){if(!DATA)return;const a=DATA.ajanlar,g=DATA.gunluk;const m={trend:a.trend||'Henüz trend özeti yok — “Trend avcısı”nı çalıştır.',editor:(a.editor_dosya?'['+a.editor_dosya+']\n\n':'')+(a.editor||'Not yok'),haber:(a.haber||[]).map(n=>`[${n.puan}] ${n.ozet}  (${n.kaynak})`).join('\n\n')||'veri yok',glog:(g.log||[]).join('\n'),alog:(a.log||[]).join('\n')};$('panel').textContent=m[TAB]}
function render(s){
  DATA=s;const g=s.gunluk,a=s.ajanlar,sy=s.sistem,L=a.dongu||{};
  const calisiyor=g.kilit&&g.canli,eski=g.kilit&&!g.canli;
  $('durum').className='orb '+(calisiyor?'run':eski?'warn':'');
  $('durum').lastElementChild.textContent=calisiyor?'Günlük koşu sürüyor':eski?'Eski kilit var':'Sistem hazır';
  // üst istatistik
  const v=(s.videolar||[]).filter(x=>x.canli&&x.canli.gizlilik==='public');
  count('s_vid',v.length);count('s_view',v.reduce((t,x)=>t+(+x.canli.izlenme||0),0));
  const act=L.pid&&!L.calismiyor&&!L.stopped;
  $('s_loop').textContent=act?(L.current?'ÇALIŞIYOR':'BEKLİYOR'):'KAPALI';$('s_loop').className='n '+(act?(L.current?'c':'o'):'b');
  $('s_loop_l').textContent=act?(L.current?L.current:'bitiş '+dk(L.until)):'ajan döngüsü';
  const nal=(a.uyarilar||[]).length;count('s_al',nal);$('s_al').className='n '+(nal?'b':'o');
  // boru hattı
  $('p_is').textContent=g.is||'—';$('p_lock').textContent=g.kilit?`kilit pid ${g.pid} · ${g.yas_dk} dk · ${g.canli?'canlı':'ölü'}`:'kilit yok — boşta';
  const st=g.adimlar||[];$('pipe').innerHTML=st.map((x,i)=>`<div class="node ${calisiyor&&i===st.length-1?'now':''}"><div class="d">${calisiyor&&i===st.length-1?'⟳':'✓'}</div><div class="t">${esc(x.ad.replace('render_','r·'))}</div><div>${esc(x.saat)}</div></div>`).join('')||'<span class="mut">adım yok</span>';
  // videolar
  $('videolar').innerHTML=(s.videolar||[]).map(x=>{const c=x.canli||{};const pub=c.gizlilik==='public';
    const bd=c.gizlilik?(pub?'<span class="pill ok">● yayında</span>':`<span class="pill warn">${esc(c.gizlilik)}${c.yayin?' · '+dk(c.yayin):''}</span>`):'';
    return `<a class="v ${x.tur==='short'?'s':''}" href="https://youtu.be/${x.id}" target="_blank"><div class="im" style="background-image:url(https://i.ytimg.com/vi/${x.id}/mqdefault.jpg)"><div class="bd">${bd}</div><div class="vw">👁 ${esc(c.izlenme??'—')}</div></div><div class="tt"><span class="pill ${x.tur==='uzun'?'gold':'acc'}" style="margin-right:6px">${x.tur}</span>${esc((c.baslik||x.baslik)).slice(0,62)}</div></a>`}).join('');
  // halkalar
  $('rings').innerHTML=Object.entries(L.tasks||{}).map(([k,t])=>{const el=t.last_end?(new Date()-new Date(t.last_end))/60000:t.interval_min;const p=Math.min(100,Math.round(el/t.interval_min*100));const cur=L.current===k;const ok=t.last_code===0;
    return `<div class="ringc ${cur?'act':''}"><div class="ring" style="--p:${cur?100:p};--c:${t.last_code>0?'var(--bad)':'var(--cy)'}"><span>${cur?'⟳':p+'%'}</span></div><div><b>${k}</b><small>${cur?'çalışıyor…':t.last_end?(ok?'✓ ':'✗ ')+rel(t.last_end):'henüz çalışmadı'}${t.skipped?' · meşgul':''}<br>her ${t.interval_min} dk</small></div></div>`}).join('')||'<span class="mut">döngü kapalı — ▶ Başlat</span>';
  // sistem
  const ram=sy.ram_yuzde??0;
  $('sistem').innerHTML=`<div class="kv"><span class="mut">Ollama</span><span>${sy.ollama_acik?'<span class="pill ok">açık</span>':'<span class="pill bad">kapalı</span>'} ${sy.ollama&&sy.ollama.length?esc(sy.ollama.join(', ')):''}</span></div>
   <div class="kv"><span class="mut">RAM boş</span><span>${sy.ram_bos_gb??'—'} GB</span></div><div class="bar"><i style="width:${ram}%"></i></div>
   <div class="kv" style="margin-top:8px"><span class="mut">C: / E: boş</span><span>${sy.disk?.C??'—'} GB / ${sy.disk?.E??'—'} GB</span></div>`;
  // görevler
  $('gorevler').innerHTML=(Array.isArray(s.gorevler)?s.gorevler:[]).sort((x,y)=>String(x.sonraki).localeCompare(String(y.sonraki))).map(t=>{const r=t.sonuc;const good=r===0,run=r==267009||r==267011;
    return `<div class="tk"><div class="nm">${esc(t.ad.replace('YTBot_',''))}<small>son: ${esc(t.son||'—')}</small></div><span class="pill ${good?'ok':run?'':'bad'}">${good?'başarılı':run?'çalışıyor':'kod '+r}</span><span class="rel">${rel(t.sonraki)}</span></div>`}).join('');
  // uyarılar
  $('uyarilar').innerHTML=(a.uyarilar||[]).map(u=>`<div class="al"><span class="pill ${u.level==='kritik'||u.level==='hata'?'bad':'warn'}">${esc(u.agent)}</span><span style="flex:1">${esc(u.msg).slice(0,170)}</span><small>${esc((u.at||'').slice(5,16).replace('T',' '))}</small></div>`).join('')||'<span class="mut">uyarı yok 🎉</span>';
  // bant
  const hs=(a.haber||[]).map(n=>`<span><em>${esc(n.kat||'').toUpperCase()}</em>${esc(n.ozet).slice(0,120)}</span>`).join('');$('ticker').innerHTML=hs+hs;
  drawPanel();
}
async function load(){try{const r=await fetch('/api/state');render(await r.json())}catch(e){$('durum').className='orb bad';$('durum').lastElementChild.textContent='sunucuya ulaşılamıyor'}}
drawTabs();load();setInterval(load,6000);
// parçacıklar
(function(){const c=$('fx'),x=c.getContext('2d');let W,H,P=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(70,W/22)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,v:Math.random()*.25+.05,a:Math.random()*.5+.15}))}
rs();addEventListener('resize',rs);(function f(){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=`rgba(246,196,83,${p.a})`;x.fill()}requestAnimationFrame(f)})()})();
</script>
